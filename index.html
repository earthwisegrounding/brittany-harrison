<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Brittany Harrison</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,500;1,500;1,600&display=swap" rel="stylesheet">
<style>
  :root{
    --gold:#ffd97a; --rose:#ff7eb3; --violet:#a97bff; --cyan:#67e8f9;
  }
  *{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;overflow:hidden;background:#07060f;}
  body{
    font-family:'Playfair Display',serif;
    color:#fff;
    background:
      radial-gradient(1200px 800px at 20% 10%, rgba(169,123,255,.18), transparent 60%),
      radial-gradient(1000px 700px at 85% 90%, rgba(255,126,179,.16), transparent 60%),
      radial-gradient(900px 900px at 50% 50%, rgba(103,232,249,.07), transparent 70%),
      #07060f;
  }
  #stage{position:fixed;inset:0;overflow:hidden;}

  /* floating ambient sparkles */
  .amb{position:absolute;border-radius:50%;pointer-events:none;filter:blur(.5px);opacity:.5;
    background:radial-gradient(circle,#fff,rgba(255,255,255,0));animation:drift linear infinite;}
  @keyframes drift{from{transform:translateY(0)}to{transform:translateY(-120vh)}}

  .hint{position:fixed;top:22px;left:0;right:0;text-align:center;font-style:italic;
    font-size:clamp(13px,2.6vw,17px);letter-spacing:.04em;color:rgba(255,255,255,.55);
    pointer-events:none;transition:opacity .6s ease;z-index:5;}

  /* each letter */
  .ltr{
    position:absolute;top:0;left:0;will-change:transform;cursor:grab;
    font-family:'Great Vibes',cursive;line-height:1;
    font-size:var(--fs);
    background:linear-gradient(120deg,var(--gold),var(--rose) 40%,var(--violet) 70%,var(--cyan));
    background-size:260% 260%;
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 0 1px rgba(255,255,255,.0);
    filter:drop-shadow(0 6px 16px rgba(169,123,255,.45)) drop-shadow(0 0 26px rgba(255,126,179,.35));
    animation:sheen 7s ease-in-out infinite;
    touch-action:none;
  }
  .ltr.drag{cursor:grabbing;filter:drop-shadow(0 10px 26px rgba(255,217,122,.65)) drop-shadow(0 0 40px rgba(255,126,179,.6));}
  .ltr.hit{animation:pop .36s ease;}
  @keyframes sheen{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
  @keyframes pop{0%{filter:drop-shadow(0 0 34px #fff) brightness(1.7)}100%{}}

  /* the reveal */
  #reveal{
    position:fixed;left:50%;bottom:7vh;transform:translateX(-50%);
    width:min(92vw,900px);text-align:center;z-index:4;pointer-events:none;
  }
  #words{font-style:italic;font-weight:600;line-height:1.5;
    font-size:clamp(18px,4.2vw,34px);letter-spacing:.01em;}
  #words .w{display:inline-block;margin:0 .14em;opacity:0;transform:translateY(14px) scale(.82);
    filter:blur(6px);transition:all .7s cubic-bezier(.2,.9,.2,1);
    background:linear-gradient(110deg,#fff,var(--gold) 55%,var(--rose));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 2px 24px rgba(255,126,179,.0);}
  #words .w.on{opacity:1;transform:none;filter:blur(0);}
  #words .w.flash{animation:wflash .8s ease;}
  @keyframes wflash{0%{filter:brightness(2.4) drop-shadow(0 0 20px #fff)}100%{}}

  #bar{margin:18px auto 0;width:min(70vw,360px);height:6px;border-radius:10px;
    background:rgba(255,255,255,.1);overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);}
  #fill{height:100%;width:0%;border-radius:10px;
    background:linear-gradient(90deg,var(--gold),var(--rose),var(--violet));
    box-shadow:0 0 18px rgba(255,126,179,.6);transition:width .5s ease;}
  #sub{margin-top:9px;font-size:12px;letter-spacing:.22em;text-transform:uppercase;
    color:rgba(255,255,255,.4);font-family:'Playfair Display',serif;}

  #stage.done #reveal{animation:lift 1.1s cubic-bezier(.2,.9,.2,1) forwards;}
  @keyframes lift{to{bottom:9vh}}
  #heart{position:fixed;inset:0;pointer-events:none;z-index:3;}
</style>
</head>
<body>
<div id="stage">
  <div class="hint" id="hint">Grab a letter &amp; fling it — set them smashing to reveal the secret ✦</div>
  <div id="reveal">
    <div id="words"></div>
    <div id="bar"><div id="fill"></div></div>
    <div id="sub">keep flinging…</div>
  </div>
  <canvas id="heart"></canvas>
</div>

<script>
(function(){
  const stage = document.getElementById('stage');
  const NAME = "Brittany Harrison";
  const PHRASE = "Damn girl! You got an incredible booty! You should probably let Steve smack it around!";
  const words = PHRASE.split(" ");

  // ---- build the floating ambient sparkles ----
  for(let i=0;i<34;i++){
    const s=document.createElement('div');s.className='amb';
    const sz=Math.random()*3+1.2;
    s.style.width=s.style.height=sz+'px';
    s.style.left=(Math.random()*100)+'vw';
    s.style.top=(100+Math.random()*30)+'vh';
    s.style.animationDuration=(10+Math.random()*16)+'s';
    s.style.animationDelay=(-Math.random()*20)+'s';
    s.style.opacity=(.2+Math.random()*.5);
    stage.appendChild(s);
  }

  // ---- reveal words markup ----
  const wordsEl=document.getElementById('words');
  const wEls=words.map(w=>{const e=document.createElement('span');e.className='w';e.textContent=w;wordsEl.appendChild(e);wordsEl.appendChild(document.createTextNode(' '));return e;});
  const fill=document.getElementById('fill');
  const sub=document.getElementById('sub');
  const hint=document.getElementById('hint');

  let revealed=0, interactions=0;
  const PER_WORD = 2;           // interactions needed to unlock each next word
  const NEED = words.length*PER_WORD;

  function bump(){
    interactions++;
    const prog=Math.min(1, interactions/NEED);
    fill.style.width=(prog*100).toFixed(1)+'%';
    const target=Math.min(words.length, Math.floor(interactions/PER_WORD));
    while(revealed<target){
      const el=wEls[revealed];
      el.classList.add('on','flash');
      setTimeout(()=>el.classList.remove('flash'),800);
      revealed++;
      burstAt(innerWidth/2,innerHeight*0.62,14);
    }
    if(interactions>=2){hint.style.opacity='0';}
    if(revealed>=words.length && !stage.classList.contains('done')){
      stage.classList.add('done');
      sub.textContent='♡  there it is  ♡';
      sub.style.color='rgba(255,217,122,.85)';
      finale();
    } else if(revealed<words.length){
      sub.textContent='keep flinging…';
    }
  }

  // ---- letters as physics bodies (DOM) ----
  const stageRect=()=>({w:innerWidth,h:innerHeight});
  const letters=[];
  const chars=NAME.split("");

  // size + layout
  function layout(){
    const {w,h}=stageRect();
    const fs=Math.max(44, Math.min(w*0.11, 150));           // letter font size
    const adv=fs*0.62;                                        // horizontal advance
    const spaceAdv=fs*0.42;
    // measure total width
    let total=0;
    chars.forEach(c=> total += (c===' '?spaceAdv:adv));
    let x=(w-total)/2;
    const y=h*0.40;
    let idx=0;
    chars.forEach((c)=>{
      if(c===' '){ x+=spaceAdv; return; }
      const L=letters[idx] || (letters[idx]={});
      L.char=c;
      L.fs=fs;
      L.r=fs*0.34;                                            // collision radius
      L.homeX=x+adv/2;
      L.homeY=y;
      if(L.x===undefined){L.x=L.homeX;L.y=L.homeY;L.vx=0;L.vy=0;}
      x+=adv;
      idx++;
    });
    letters.length=idx;
    // build / update DOM
    letters.forEach((L,i)=>{
      if(!L.el){
        const e=document.createElement('div');e.className='ltr';e.textContent=L.char;
        e.style.setProperty('--fs',L.fs+'px');
        e.style.animationDelay=(-i*0.4)+'s';
        stage.appendChild(e);L.el=e;
        attachDrag(L);
      }
      L.el.style.setProperty('--fs',L.fs+'px');
      L.half=L.fs*0.34;
    });
  }

  // ---- interaction (pointer) ----
  let active=null, px=0,py=0, lpx=0,lpy=0, moved=false;
  function attachDrag(L){
    L.el.addEventListener('pointerdown',(ev)=>{
      ev.preventDefault();
      active=L; moved=false;
      L.el.classList.add('drag');
      try{L.el.setPointerCapture(ev.pointerId);}catch(e){}
      px=lpx=ev.clientX; py=lpy=ev.clientY;
      L.vx=L.vy=0;
    });
    L.el.addEventListener('pointermove',(ev)=>{
      if(active!==L)return;
      lpx=px;lpy=py;px=ev.clientX;py=ev.clientY;
      const dx=px-lpx, dy=py-lpy;
      if(Math.abs(dx)+Math.abs(dy)>2)moved=true;
      L.x=px; L.y=py;
      L.vx=dx; L.vy=dy;
    });
    const up=(ev)=>{
      if(active!==L)return;
      L.el.classList.remove('drag');
      active=null;
      // fling: keep the flick velocity, scaled; if just a tap give a random zip
      let speed=Math.hypot(L.vx,L.vy);
      if(speed<4){ const a=Math.random()*6.28; const s=14+Math.random()*16; L.vx=Math.cos(a)*s; L.vy=Math.sin(a)*s; }
      else { L.vx*=1.6; L.vy*=1.6; }
      bump();
    };
    L.el.addEventListener('pointerup',up);
    L.el.addEventListener('pointercancel',up);
  }

  // ---- physics loop ----
  const K=0.012, DAMP=0.992, REST=0.86, WALLREST=0.9;
  let lastHit=0;
  function step(){
    const {w,h}=stageRect();
    for(const L of letters){
      if(L===active) continue;
      // spring home
      L.vx += (L.homeX-L.x)*K;
      L.vy += (L.homeY-L.y)*K;
      L.vx*=DAMP; L.vy*=DAMP;
      L.x+=L.vx; L.y+=L.vy;
      // walls
      const r=L.half;
      if(L.x< r){L.x=r;L.vx=Math.abs(L.vx)*WALLREST;}
      if(L.x> w-r){L.x=w-r;L.vx=-Math.abs(L.vx)*WALLREST;}
      if(L.y< r){L.y=r;L.vy=Math.abs(L.vy)*WALLREST;}
      if(L.y> h-r){L.y=h-r;L.vy=-Math.abs(L.vy)*WALLREST;}
    }
    // letter-letter collisions
    for(let i=0;i<letters.length;i++){
      for(let j=i+1;j<letters.length;j++){
        const A=letters[i],B=letters[j];
        let dx=B.x-A.x, dy=B.y-A.y; let d=Math.hypot(dx,dy);
        const min=A.half+B.half;
        if(d>0 && d<min){
          const nx=dx/d, ny=dy/d, overlap=(min-d);
          const aMov=A!==active, bMov=B!==active;
          if(aMov){A.x-=nx*overlap*(bMov?0.5:1);A.y-=ny*overlap*(bMov?0.5:1);}
          if(bMov){B.x+=nx*overlap*(aMov?0.5:1);B.y+=ny*overlap*(aMov?0.5:1);}
          // elastic exchange along normal
          const va=A.vx*nx+A.vy*ny, vb=B.vx*nx+B.vy*ny;
          const diff=(vb-va);
          if(aMov){A.vx+=nx*diff*REST;A.vy+=ny*diff*REST;}
          if(bMov){B.vx-=nx*diff*REST;B.vy-=ny*diff*REST;}
          const impact=Math.abs(diff);
          if(impact>6){
            const now=performance.now();
            flashHit(A);flashHit(B);
            burstAt((A.x+B.x)/2,(A.y+B.y)/2, Math.min(22,6+impact));
            if(now-lastHit>90){ lastHit=now; if(impact>9) bump(); }
          }
        }
      }
    }
    for(const L of letters){
      L.el.style.transform=`translate(${(L.x-L.fs*0.31).toFixed(2)}px,${(L.y-L.fs*0.5).toFixed(2)}px)`;
    }
    requestAnimationFrame(step);
  }
  function flashHit(L){L.el.classList.remove('hit');void L.el.offsetWidth;L.el.classList.add('hit');}

  // ---- particle sparkle canvas ----
  const cv=document.getElementById('heart'), ctx=cv.getContext('2d');
  let parts=[];
  function sizeCanvas(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio;cv.style.width=innerWidth+'px';cv.style.height=innerHeight+'px';ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);}
  const COLORS=['#ffd97a','#ff7eb3','#a97bff','#67e8f9','#ffffff'];
  function burstAt(x,y,n){
    for(let i=0;i<n;i++){
      const a=Math.random()*6.28, s=Math.random()*4+1;
      parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c:COLORS[(Math.random()*COLORS.length)|0],r:Math.random()*2.6+1});
    }
    if(parts.length>900)parts.splice(0,parts.length-900);
  }
  function drawParts(){
    ctx.clearRect(0,0,innerWidth,innerHeight);
    for(const p of parts){
      p.vy+=0.06;p.x+=p.vx;p.y+=p.vy;p.life-=0.018;
      if(p.life<=0)continue;
      ctx.globalAlpha=Math.max(0,p.life);
      ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.3);ctx.fill();
    }
    ctx.globalAlpha=1;
    parts=parts.filter(p=>p.life>0);
    requestAnimationFrame(drawParts);
  }

  function finale(){
    // celebratory bursts
    let t=0;const iv=setInterval(()=>{
      burstAt(Math.random()*innerWidth, innerHeight*(0.25+Math.random()*0.4), 20);
      if(++t>14)clearInterval(iv);
    },110);
    // gentle nudge so letters dance
    letters.forEach(L=>{const a=Math.random()*6.28;L.vx+=Math.cos(a)*10;L.vy+=Math.sin(a)*10;});
  }

  // ---- boot ----
  function boot(){ sizeCanvas(); layout(); }
  let rT;
  addEventListener('resize',()=>{clearTimeout(rT);rT=setTimeout(()=>{sizeCanvas();
    // re-home to new layout without destroying motion
    const old=letters.map(L=>({x:L.x,y:L.y,vx:L.vx,vy:L.vy}));
    layout();
    letters.forEach((L,i)=>{if(old[i]){L.x=old[i].x;L.y=old[i].y;L.vx=old[i].vx;L.vy=old[i].vy;}});
  },180);});
  // wait a tick for fonts
  if(document.fonts && document.fonts.ready){document.fonts.ready.then(boot);setTimeout(boot,600);} else boot();
  requestAnimationFrame(step);
  requestAnimationFrame(drawParts);
})();
</script>
</body>
</html>
